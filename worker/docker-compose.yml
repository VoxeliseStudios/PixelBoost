# Server-side upscaling for the PixelBoost app. Runs on the CachyOS PC;
# upscaler-bridge on Mel forwards /jobs* here with X-Worker-Key.
services:
  pixelboost-worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    image: pixelboost-worker:latest
    container_name: pixelboost_worker
    restart: unless-stopped
    user: "1000:1000"
    # Host network so ufw applies: only Mel (upscaler-bridge) may reach :8095
    # (`ufw allow from 192.168.1.87 to any port 8095`). A Docker `ports:`
    # publish bypasses ufw and exposed it to the whole LAN. Requests without
    # the worker key are refused either way.
    network_mode: host
    environment:
      - WORKER_KEY=${WORKER_KEY}
      - RAYON_NUM_THREADS=6
      - MAX_OUTPUT_MP=300
      - RESULT_TTL_HOURS=168
      - MODELS_EXTRA_DIR=/models-extra
    volumes:
      - /mnt/fastssd/pixelboost-jobs:/jobs
      - ../Models/pbnn:/models:ro
      - ../Models/downloads:/models-extra:ro
    mem_limit: 3g
    cpus: 6
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8095/health"]
      interval: 30s
      timeout: 5s
      retries: 3
